name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      # Debug-signed APK so side-loading works without a release keystore.
      # Point CODEBRIDGE_KEYSTORE_* secrets at a release keystore before
      # public distribution.
      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/app/build/outputs/apk/debug/app-debug.apk

  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test
        working-directory: apps/macos

      - name: Package .app
        run: ./scripts/package-macos-app.sh "${GITHUB_REF_NAME#v}"

      - name: Zip
        run: cd apps/macos && zip -qry CodeBridge-macOS.zip CodeBridge.app

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/macos/CodeBridge-macOS.zip
